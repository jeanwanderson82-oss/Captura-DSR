async function init(){try{requireIt('indexedDB' in window,'Este navegador não disponibiliza IndexedDB.');db=await new Promise((resolve,reject)=>{const req=indexedDB.open('vale-receita-single-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('store');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});state=await readState();if(!state){state=seed();await rawInitial(state)}validate(state);if('BroadcastChannel'in window){channel=new BroadcastChannel('vale-receita');channel.onmessage=async()=>{state=await readState();render();toast('Base atualizada por outra aba. Formulários abertos precisam ser reabertos.')}}$('#dbStatus').textContent='● Dados salvos no dispositivo';render()}catch(e){$('#app').innerHTML=`<div class="notice error"><b>Não foi possível abrir a base.</b><br>${esc(e.message)}<br>Abra em uma versão atual do Edge/Chrome. Se necessário, sirva o arquivo em uma origem HTTP local estável. Não limpe dados do navegador sem ter backup.</div>`;toast(e.message)}}

`}
function editRef(id=''){const kind=adminKind,r=state.refs[kind].find(x=>x.id===id)||{name:'',active:true,order:state.refs[kind].length,parent:''};modal(id?'Editar opção':'Nova opção',field('Descrição','name','text',r.name,{required:true,full:true})+field('Ordem','order','number',r.order,{required:true,step:'1'})+field('Opção padrão da lista','default','checkbox',r.default)+(['categories','subcategories'].includes(kind)?rfield(kind==='categories'?'Tipo de captura (opcional)':'Categoria mãe','parent',kind==='categories'?'types':'categories',r.parent,{required:kind==='subcategories'}):''),async d=>{const next={...r,...d,id:r.id||uid(),order:Number(d.order),default:!!d.default};requireIt(d.name.trim(),'Informe uma descrição.');requireIt(!state.refs[kind].some(x=>x.id!==id&&x.name.toLocaleLowerCase()===d.name.trim().toLocaleLowerCase()),'Já existe opção com essa descrição.');next.name=d.name.trim();if(id&&r.parent!==next.parent)requireIt(!state.initiatives.some(i=>i[kind==='categories'?'category':'subcategory']===id),'Não altere o vínculo de uma categoria utilizada; crie outra opção.');await mutate(s=>{if(next.default)s.refs[kind].forEach(x=>x.default=false);if(id)Object.assign(s.refs[kind].find(x=>x.id===id),next);else s.refs[kind].push(next);addHistory(s,'admin','Matchcode alterado',r,next)},window.modalRevision);closeModal();toast('Referência salva.')})}

function showDefinitions(){modal('Como os números são calculados',`<div class="help field full"><p><b>Original:</b> primeiro potencial registrado. <b>Vigente:</b> última revisão do potencial total, incluindo vendas já realizadas.</p><p><b>Vendido:</b> vendas válidas. <b>Recebido — critério caixa:</b> recebimentos efetivos, excluindo os estornados. Não equivale a faturamento ou reconhecimento contábil.</p><p><b>Saldo a receber:</b> vendido menos recebido. <b>Potencial não vendido:</b> máximo entre vigente menos vendido e zero. Não é previsão de caixa firme.</p><p><b>Previsão de caixa:</b> saldo das parcelas de vendas formalizadas, por vencimento. Recebimentos são alocados às parcelas mais antigas. A previsão indicativa da oportunidade é exibida separadamente.</p><p>Estimativas no dashboard incluem iniciativas ativas e não arquivadas. Vendas e recebimentos no dashboard respeitam a carteira visível. A Gestão Financeira inclui arquivadas por padrão. Cancelamentos não apagam fatos históricos.</p><p><b>Atraso:</b> ação/marco aplicável com data anterior a hoje e sem conclusão, ou parcela vencida com saldo. Hoje não está vencido. Uma iniciativa é contada uma única vez.</p><p><b>Progresso:</b> ações concluídas ÷ ações não canceladas. Sem plano não equivale a 100%.</p><p>Os valores são brutos em BRL. Gráficos de estimado, vendido e recebido não são aditivos.</p></div>`,null)}
function backupPage(){return pageHead('Sua base, sob controle.','Exporte com frequência e mantenha uma cópia segura dos seus dados.')+`<div class="grid"><section class="panel"><h2>Backup e restauração</h2><p>O backup JSON inclui iniciativas, ações, vendas, parcelas, recebimentos, configurações e histórico.</p><div class="toolbar"><button class="primary" onclick="exportBackup()">↓ Exportar backup completo</button><button onclick="$('#importFile').click()">↑ Restaurar backup JSON</button></div><p class="muted tiny">Última exportação nesta sessão: ${window.lastExport?esc(new Date(window.lastExport).toLocaleString('pt-BR')):'ainda não realizada'}.<br>Restauração substitui integralmente a base; não mescla nem sincroniza computadores.</p></section><section class="panel"><h2>Ambiente de trabalho</h2><p>${state.initiatives.length} iniciativas · ${state.actions.length} ações · ${state.sales.length} vendas<br>Esquema v${state.schema} · revisão ${state.revision}<br>${state.demo?'Base fictícia de demonstração':'Base de trabalho local'}</p><div class="toolbar"><button onclick="loadDemo()" ${state.initiatives.length?'disabled':''}>Carregar demonstração</button><button class="danger" onclick="newEmptyBase()">Iniciar base vazia</button></div></section></div><section class="panel help"><h2>Como utilizar</h2><ol><li>Abra este arquivo em Edge ou Chrome atualizado. Toda a aplicação está neste HTML, sem bibliotecas externas.</li><li>Em Administração, cadastre unidades, responsáveis e categorias.</li><li>Crie uma iniciativa e informe suas previsões. Monte o plano de ação na aba correspondente.</li><li>Use o Kanban para solicitar uma mudança de etapa. O formulário valida marcos e exceções.</li><li>Registre as vendas e as parcelas. Depois lance os recebimentos parciais para atualizar os saldos.</li><li>Exporte o backup JSON regularmente. O CSV serve para análise, não para restauração.</li></ol><h3>Armazenamento local</h3><p>A base fica no IndexedDB deste navegador e desta origem. Copiar o HTML não copia os dados. Limpeza de dados, modo privado, mudança de navegador/origem ou falha do dispositivo podem impedir o acesso à base. Em file://, o comportamento depende do navegador. Se houver bloqueio, utilize uma origem HTTP local estável; mantenha endereço e porta para continuar na mesma base.</p><h3>Uso compartilhado pela equipe</h3><p>Exige API corporativa, banco central, autenticação, autorização por perfil, controle de concorrência e backup/auditoria centralizados. Esta versão permite apenas operação local; não há sincronização ou login corporativo. Histórico local não é inviolável. Não inclua credenciais no HTML.</p><h3>Limites desta versão</h3><p>Fluxos versionados são selecionados em novas iniciativas; migração de iniciativas antigas entre fluxos não é disponibilizada. Estados de ações/situações mantêm classificações fixas. Não há anexos, integração SAP, reconhecimento contábil, tributos/comissões ou adiantamentos sem venda. Estorno é integral; corrija pelo estorno e novo registro. Não há posição histórica de pipeline por snapshots.</p></section>`}

function exportBackup(){requireIt(state,'Aguarde a abertura da base.');download('receita-backup-'+today()+'.json',JSON.stringify({app:'gestao-iniciativas-receita',exportedAt:new Date().toISOString(),data:state},null,2),'application/json;charset=utf-8');window.lastExport=new Date().toISOString();if(view==='backup')render();toast('Backup gerado. Confira o arquivo na pasta de downloads.')}
function exportCSV(){const xs=picked(!!window.showArchived);const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const rows=[['ID','Título','Tipo','Unidade','Responsável','Etapa','Situação','Original BRL','Vigente BRL','Vendido BRL','Recebido BRL','Saldo BRL'],...xs.map(i=>{const f=financial(i);return[i.code,i.title,ref('types',i.type),ref('units',i.unit),ref('owners',i.owner),stage(i).name,STATES[i.status],i.original==null?'':moneyInput(i.original).replace('.',','),f.potential==null?'':moneyInput(f.potential).replace('.',','),moneyInput(f.sold).replace('.',','),moneyInput(f.received).replace('.',','),moneyInput(f.balance).replace('.',',')]})];download('carteira-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
$('#importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{requireIt(file.size<25*1024*1024,'Backup acima do limite de 25 MB.');const raw=JSON.parse(await file.text());requireIt(raw.app==='gestao-iniciativas-receita','Este arquivo não é um backup do aplicativo.');const imported=raw.data;validate(imported);modal('Restaurar backup',`<div class="notice warn field full">A base atual será substituída integralmente por ${imported.initiatives.length} iniciativas, ${imported.actions.length} ações, ${imported.sales.length} vendas e ${imported.receipts.length} recebimentos.<br>Exportado em: ${esc(raw.exportedAt)}.<br>Recomendamos exportar a base atual antes de continuar.</div><div class="field full"><button type="button" onclick="exportBackup()">Exportar base atual antes de restaurar</button></div>`+field('Digite RESTAURAR para confirmar','confirm','text','',{required:true,full:true}),async d=>{requireIt(d.confirm==='RESTAURAR','Digite RESTAURAR para confirmar.');await mutate(s=>{const rev=s.revision;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,copy(imported),{revision:rev})},window.modalRevision);closeModal();clearFilters();toast('Backup restaurado integralmente.');},'Substituir base')}catch(err){toast('Importação rejeitada: '+err.message)}};
function newEmptyBase(){modal('Iniciar base vazia',`<div class="notice warn field full">Todos os dados desta base serão removidos. Exporte seu backup antes. Esta operação não pode ser desfeita sem um backup.</div><div class="field full"><button type="button" onclick="exportBackup()">Exportar backup atual</button></div>`+field('Digite LIMPAR para confirmar','confirm','text','',{required:true,full:true}),async d=>{requireIt(d.confirm==='LIMPAR','Digite LIMPAR para confirmar.');await mutate(s=>{const rev=s.revision;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,seed(),{revision:rev})},window.modalRevision);closeModal();clearFilters();go('dashboard');toast('Base vazia pronta para uso.')},'Limpar e iniciar')}
function demoData(){const s=seed();s.demo=true;s.refs.owners=['Ana Lima','Bruno Costa','Carla Mendes','Diego Alves'].map((name,j)=>({id:'owners-'+j,name,active:true,order:j,parent:''}));const dt=n=>{const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const defs=[['Equipamentos móveis · lote 01',1,0,2,125000000,145000000],['Sucata ferrosa · campanha pátio',2,1,4,38000000,42000000],['Motores e redutores inservíveis',4,2,3,18500000,21000000],['Cobre e cabos · lote 07',3,3,6,24000000,26500000],['Ativos industriais · britagem',0,0,1,85000000,95000000],['Materiais diversos · almoxarifado',4,1,0,null,null]];defs.forEach(([title,type,unit,st,original,pot],j)=>{const id=uid(),i={id,code:'DEMO-'+String(j+1).padStart(3,'0'),title,type:'types-'+type,unit:'units-'+unit,owner:'owners-'+j%4,area:'areas-2',priority:'priorities-'+j%3,identified:dt(-50+j*3),description:'Iniciativa fictícia para demonstrar a preparação, comercialização e captura de receita.',location:'Pátio de materiais · área demonstrativa',status:'active',flowId:'flow-standard',stage:'stage-'+st,original,estimateMode:'direct',unitPrice:null,quantity:null,availablePlan:dt(j===0?-7:10+j*5),availableReal:st>=3?dt(-25):'',salePlan:dt(20+j*4),saleReal:st>=5?dt(-10):'',receiptPlan:dt(30+j*5),blocked:j===0,blockReason:j===0?'blocks-0':'',blockNotes:j===0?'Aguardando regularização documental do lote.':'',created:new Date().toISOString(),archived:false};s.initiatives.push(i);if(pot!==null)s.revisions.push({id:uid(),initiativeId:id,value:pot,date:dt(-10),reason:'Reavaliação fictícia após levantamento técnico.'});const aid=uid();s.actions.push({id:aid,initiativeId:id,title:'Concluir levantamento e avaliação técnica',owner:i.owner,status:j%2?'done':'doing',due:dt(j%2?-10:-3),originalDue:dt(-10),doneDate:j%2?dt(-12):'',required:true,priority:'priorities-0',deps:[],created:new Date().toISOString()});s.actions.push({id:uid(),initiativeId:id,title:'Organizar lote e documentação de venda',owner:i.owner,status:'todo',due:dt(8+j*2),originalDue:dt(8+j*2),deps:[aid],required:false,created:new Date().toISOString()});addHistory(s,id,'Iniciativa de demonstração criada',null,i);if(j===1||j===3){const v={id:uid(),initiativeId:id,description:j===1?'Venda parcial · sucata ferrosa':'Venda de cobre · lote 07',date:dt(-15),value:j===1?18000000:25000000,document:'DEMO-VENDA-'+j,cancelled:false};s.sales.push(v);s.installments.push({id:uid(),saleId:v.id,due:dt(-4),value:Math.round(v.value/2)},{id:uid(),saleId:v.id,due:dt(25),value:Math.round(v.value/2)});s.receipts.push({id:uid(),saleId:v.id,date:dt(-5),value:j===1?6000000:12000000,document:'DEMO-REC-'+j,reversed:false});addHistory(s,id,'Venda de demonstração',null,v)}});validate(s);return s}
async function loadDemo(){if(state.initiatives.length){toast('A demonstração só pode ser carregada em uma base vazia.');return}try{await mutate(s=>{const rev=s.revision;Object.assign(s,demoData(),{revision:rev})});toast('Demonstração fictícia carregada.');}catch(e){toast(e.message)}}
const validateBase=validate;
validate=function(s){
 requireIt(s&&typeof s==='object','Backup inválido.');
 const safeId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(v);
 for(const key of ['initiatives','actions','revisions','sales','installments','receipts','history','documents','flows'])if(Array.isArray(s[key]))for(const x of s[key])requireIt(x&&safeId(x.id),'Identificador inválido no backup.');
 if(s.refs)for(const list of Object.values(s.refs))if(Array.isArray(list))for(const x of list)requireIt(x&&safeId(x.id),'Identificador de referência inválido.');
 if(Array.isArray(s.flows)){requireIt(s.flows.length>0,'Backup sem fluxo.');for(const f of s.flows)if(Array.isArray(f.stages))f.stages.forEach(t=>requireIt(safeId(t.id),'Identificador de etapa inválido.'));}
 return validateBase(s);
};
const dashboardBase=dashboard;
dashboard=function(){return dashboardBase().replace('<div class="kpis">',`<div class="filters"><label>Período financeiro · de<input type="date" value="${esc(filters.from)}" onchange="applyFilter('from',this.value)"></label><label>Até<input type="date" value="${esc(filters.to)}" onchange="applyFilter('to',this.value)"></label><span class="tiny muted" style="flex:2;align-self:center">Vendas e recebimentos pelas datas dos fatos. Carteira e estimativas na posição atual.</span></div><div class="kpis">`)};
